<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SAPS — Acesso ao sistema</title>

        <!-- ESTE CSS É EXCLUSIVO DO LOGIN: NÃO É NECESSÁRIO ALTERAR O STYLE.CSS DO PAINEL -->
        <link rel="stylesheet" href="login.css">
        <!-- DEFER EXECUTA O JAVASCRIPT DEPOIS QUE O HTML FOI LIDO. -->
        <script src="login.js" defer></script>
    </head>
    <body>
        <main class="cartao-login">
            <!-- IDENTIDADE DO SISTEMA E A APRESENTAÇÃO DO FORMULÁRIO -->
            <header class="cabecalho-login">
                <div class="marca">
                    <!-- A LOGO VEM ANTES DO NOME NO HTML; O CSS ORGANIZA OS DOIS EM COLUNA.
                     ALT VAZIO EVITA REPETIR A MARCA: SAPS JÁ ESTÁ ESCRITO ABAIXO. -->
                    <img src="LOGO_SAPS_V1.png" alt="" class="logo-login" width="64" height="64">
                    <div class="marca-texto">
                        <p class="nome-sistema">SAPS</p>
                    </div>
                </div>

                <!-- TÍTULO PRINCIPAL -->
                <h1>Acesse o sistema</h1>
                <p class="introducao">Informe suas credenciais para continuar.</p>
            </header>

            <!-- POST ENVIA OS CAMPOS NO CORPO DA REQUISIÇÃO, EM VEZ DA URL. -->
            <form class="formulario-login" id="formulario-login" action="/api/login" method="post">
                <div class="campo">
                    <!-- FOR APONTA PARA O ID DO INPUT: CLICAR NO RÓTULO SELECIONA O CAMPO CORRETO. -->
                    <label for="email">E-mail</label>
                    <!-- NAME É O NOME COM QUE O BACKEND RECEBE O CAMPO. -->
                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="150"
                        placeholder="Digite seu e-mail"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                   >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <!-- PASSWORD OCULTA OS CARACTERES NA TELA; NÃO CRIPTOGRAFA NEM VALIDA A SENHA.
                     CURRENT-PASSWORD INDICA UMA SENHA JÁ CADASTRADA, NÃO UMA NOVA SENHA. -->
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        maxlength="72"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                   >
                </div>

                <button class="botao-entrar" type="submit">Entrar</button>
            </form>

            <details class="ajuda-acesso">
                <summary>Esqueci minha senha</summary>
                <p>Para recuperar sua senha, entre em contato com o departamento de TI pelo <strong>ramal 7773</strong>.</p>
            </details>
            <p id="mensagem-acesso" class="mensagem-login" role="status" hidden></p>
            <footer class="rodape-login">
                <p class="nota-academica">Projeto Integrador · PUC-Campinas</p>
            </footer>
        </main>
    </body>
</html>
