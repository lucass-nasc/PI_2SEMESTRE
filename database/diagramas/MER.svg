<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1110" viewBox="0 0 1680 1110" role="img" aria-labelledby="titulo descricao"><title id="titulo">MER • SAPS</title><desc id="descricao">Modelo conceitual. Os números junto às entidades indicam quantas ocorrências são admitidas em cada relação.</desc>
