<text x="48" y="98" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#152f42">MER · Quem participa de cada atendimento</text>
<text x="50" y="135" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#354e60">Leia cada ligação pelo verbo. Os números junto às pontas indicam quantos registros daquele lado podem participar.</text>
