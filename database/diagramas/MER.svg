<rect x="50" y="913" width="1580" height="153" rx="10" fill="#edf5f7" stroke="none" stroke-width="2"/>
<text x="74" y="949" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#152f42">Como ler o modelo</text>
<text x="74" y="983" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#152f42">1 = exatamente um     •     0..1 = nenhum ou um     •     0..N = nenhum ou vários</text>
<text x="74" y="1016" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#152f42">Exemplo: um paciente pode voltar várias vezes. Uma senha recém-gerada ainda não precisa estar ligada a um paciente.</text>
<text x="74" y="1047" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#152f42">Prontuário: histórico consultado a partir desses registros. Triagem e consulta se encontram pelo mesmo atendimento.</text>
